[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "cerebro"
version = "0.1.0"
description = "The company second brain"
requires-python = ">=3.12"
authors = [
    {name = "Rohan", email = "rohanpxquantum@gmail.com"},
    {name = "Shreya Mishra", email = "shreyamishra2k05@gmail.com"},
]
license = {text = "Apache-2.0"}
readme = "README.md"
keywords = [
    "cerebro",
    "second-brain",
    "ai-agent",
    "fastapi",
    "identity",
    "messaging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries",
    "Topic :: Communications",
]
dependencies = [
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "caspian-sdk",
    "httpx>=0.25",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "PyJWT[crypto]>=2.8",
]

[project.urls]
Repository = "https://github.com/RohanOnKeys/cerebro"
Homepage = "https://github.com/RohanOnKeys/cerebro"
Issues = "https://github.com/RohanOnKeys/cerebro/issues"

[project.scripts]
cerebro-gateway = "cerebro.gateway:run_gateway"

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "mypy>=1.5",
    "pre-commit>=3.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # line too long, handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["cerebro"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
